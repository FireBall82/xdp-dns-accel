name: Security and packet validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-xdp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        xdp-mode: [generic, native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build and namespace tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang llvm libbpf-dev libxdp-dev python3 iproute2
      - name: Build with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Build production binary for privileged packet tests
        run: |
          cmake -S . -B build-packet
          cmake --build build-packet -j2
      - name: Test real packets, worker privileges, policy and crash cleanup
        run: sudo python3 tests/xdp_smoke.py ./build-packet/dns_daemon ${{ matrix.xdp-mode }} | tee packet-results.log
      - name: Retain measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.xdp-mode }}
          path: |
            packet-results.log
            build/Testing/Temporary/LastTest.log
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y cmake clang llvm libbpf-dev libxdp-dev python3
      - name: Build and exercise both fuzz targets
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_FUZZERS=ON
          cmake --build build-fuzz -j2
          ctest --test-dir build-fuzz --output-on-failure
          mkdir -p fuzz-results
          ./build-fuzz/fuzz_dns -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=512 -artifact_prefix=fuzz-results/ build-fuzz/fuzz_corpus/dns 2>&1 | tee fuzz-results/dns.log
          ./build-fuzz/fuzz_packet -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=512 -artifact_prefix=fuzz-results/ build-fuzz/fuzz_corpus/packet 2>&1 | tee fuzz-results/packet.log
      - name: Retain fuzz logs and reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-results
          path: fuzz-results/
